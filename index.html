<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Smudged Glass</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #111;
    overflow: hidden;
    height: 100%;
  }
  canvas { display: block; }
  #overlay {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain; /* must match the fit math in fitRect() */
    pointer-events: none;
  }
  #hint {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.75);
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    font-family: -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    letter-spacing: 0.02em;
    pointer-events: none;
    transition: opacity 1s ease;
  }
  #hint.hidden { opacity: 0; }
</style>
</head>
<body>
<img id="overlay" alt="" />
<div id="hint">click or press space to try another frame</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<script>

let video;
let glassShader;
let blurGfx;     // small, blurred copy of the video (the "fogged" look)
let clarityGfx;  // grayscale mask: where the user has wiped the glass clear
let noiseGfx;    // static tileable noise used for the glass distortion + grain

const SCALE_DOWN = 4; // clarity/blur buffers are this much smaller than the canvas
let bufW, bufH;
let hintEl;
let hasInteracted = false;

// glasses overlays, drawn as an <img> on top of the canvas. The camera only
// shows through each frame's lenses, found by flood-filling the SVG's alpha.
const FRAME_FILES = [
  'assets/MacBook Pro 16_ - 3.svg',
  'assets/MacBook Pro 16_ - 4.svg',
  'assets/MacBook Pro 16_ - 5.svg',
  'assets/MacBook Pro 16_ - 6.svg',
];
const ALPHA_WALL = 24;        // pixels at least this opaque count as frame
const MIN_LENS_RATIO = 0.25;  // enclosed regions smaller than this x the biggest one aren't lenses
                              // (letter holes in the caption, the gap in an aviator's double bridge)
let frames = [];              // { url, w, h, lens: p5.Graphics | null, failed }
let noLens;                   // black placeholder while a mask is still loading
let frameIndex = 0;
let overlayEl;
let pressX = 0, pressY = 0;

const vertSrc = `
precision highp float;
attribute vec3 aPosition;
attribute vec2 aTexCoord;
varying vec2 vTexCoord;
uniform mat4 uModelViewMatrix;
uniform mat4 uProjectionMatrix;

void main() {
  vTexCoord = aTexCoord;
  vec4 positionVec4 = vec4(aPosition, 1.0);
  gl_Position = uProjectionMatrix * uModelViewMatrix * positionVec4;
}
`;

const fragSrc = `
precision highp float;
varying vec2 vTexCoord;

uniform sampler2D uSharp;
uniform sampler2D uBlur;
uniform sampler2D uClarity;
uniform sampler2D uNoise;
uniform float uTime;
uniform vec2 uNoiseOffset;
uniform sampler2D uLens;
uniform float uHasLens;
uniform vec4 uFit; // overlay rect in screen uv: xy = offset, zw = size

void main() {
  vec2 uv = vTexCoord;

  float clarity = texture2D(uClarity, uv).r;

  // scrolling noise field bends the image like uneven glass; wiped areas distort less
  vec2 noiseUV = fract(uv * 3.0 + uNoiseOffset);
  vec2 n = texture2D(uNoise, noiseUV).rg - 0.5;
  float distortAmt = mix(0.028, 0.003, clarity);
  vec2 duv = uv + n * distortAmt;

  vec3 sharpColor = texture2D(uSharp, duv).rgb;
  vec3 blurColor  = texture2D(uBlur, duv).rgb;

  vec3 col = mix(blurColor, sharpColor, clarity);

  // cool, slightly milky tint over the fogged parts
  vec3 fogTint = vec3(0.86, 0.90, 0.94);
  float fogAmt = 1.0 - clarity;
  col = mix(col, col * fogTint + 0.03 * fogAmt, fogAmt);

  // soft vignette
  vec2 centered = vTexCoord - 0.5;
  float vig = smoothstep(0.9, 0.25, length(centered));
  col *= mix(0.72, 1.0, vig);

  // fine grain so the fog doesn't look flat
  float grain = texture2D(uNoise, uv * 9.0 + uTime * 0.015).r;
  col += (grain - 0.5) * 0.035;

  // smudged glass inside the lenses, the plain camera feed everywhere else
  vec2 luv = (vTexCoord - uFit.xy) / uFit.zw;
  float inBounds = step(0.0, luv.x) * step(luv.x, 1.0) * step(0.0, luv.y) * step(luv.y, 1.0);
  float lens = smoothstep(0.02, 0.3, texture2D(uLens, clamp(luv, 0.0, 1.0)).r) * inBounds;
  lens = mix(1.0, lens, uHasLens);

  vec3 clearView = texture2D(uSharp, uv).rgb;
  gl_FragColor = vec4(mix(clearView, col, lens), 1.0);
}
`;

function setup() {
  createCanvas(windowWidth, windowHeight, WEBGL);
  noStroke();

  video = createCapture(VIDEO, () => {});
  video.size(640, 480);
  video.hide();

  bufW = floor(width / SCALE_DOWN);
  bufH = floor(height / SCALE_DOWN);

  blurGfx = createGraphics(bufW, bufH);
  clarityGfx = createGraphics(bufW, bufH);
  clarityGfx.pixelDensity(1);
  clarityGfx.background(0);

  noiseGfx = createGraphics(256, 256);
  noiseGfx.pixelDensity(1);
  noiseGfx.loadPixels();
  noiseDetail(4, 0.5);
  for (let y = 0; y < noiseGfx.height; y++) {
    for (let x = 0; x < noiseGfx.width; x++) {
      const i = (x + y * noiseGfx.width) * 4;
      const r = noise(x * 0.05, y * 0.05) * 255;
      const g = noise(x * 0.05 + 500, y * 0.05 + 500) * 255;
      noiseGfx.pixels[i] = r;
      noiseGfx.pixels[i + 1] = g;
      noiseGfx.pixels[i + 2] = 0;
      noiseGfx.pixels[i + 3] = 255;
    }
  }
  noiseGfx.updatePixels();

  glassShader = createShader(vertSrc, fragSrc);
  hintEl = select('#hint');
  overlayEl = document.getElementById('overlay');
  noLens = createGraphics(1, 1);
  noLens.background(0);

  frames = FRAME_FILES.map(f => ({ url: encodeURI(f), w: 1728, h: 1117, lens: null }));
  showFrame(0);
  frames.forEach(fr => {
    const img = new Image();
    img.onload = () => {
      fr.w = img.naturalWidth || fr.w;
      fr.h = img.naturalHeight || fr.h;
      try {
        fr.lens = buildLensMask(img, fr.w, fr.h);
      } catch (e) {
        // file:// pages can't read image pixels; serve the folder (e.g. Live Server) instead
        console.warn('Could not build lens mask for', fr.url, e);
        fr.failed = true;
      }
    };
    img.src = fr.url;
  });
}

// Everything transparent that can be reached from the image border is "outside".
// Transparent pixels the flood can't reach are enclosed by the frame: the lenses.
function buildLensMask(img, w, h) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, 0, 0, w, h);
  const px = ctx.getImageData(0, 0, w, h);
  const alpha = px.data;
  const n = w * h;
  const open = new Uint8Array(n);
  for (let i = 0; i < n; i++) open[i] = alpha[i * 4 + 3] < ALPHA_WALL ? 1 : 0;

  // 0 = unvisited, 1 = outside, 2+ = enclosed region id
  const label = new Int32Array(n);
  const stack = new Int32Array(n);

  const fill = (seeds, seedCount, value) => {
    let sp = 0, count = 0;
    for (let s = 0; s < seedCount; s++) {
      const i = seeds[s];
      if (open[i] && !label[i]) { label[i] = value; stack[sp++] = i; }
    }
    while (sp > 0) {
      const i = stack[--sp];
      count++;
      const x = i % w;
      if (x > 0 && open[i - 1] && !label[i - 1]) { label[i - 1] = value; stack[sp++] = i - 1; }
      if (x < w - 1 && open[i + 1] && !label[i + 1]) { label[i + 1] = value; stack[sp++] = i + 1; }
      if (i >= w && open[i - w] && !label[i - w]) { label[i - w] = value; stack[sp++] = i - w; }
      if (i < n - w && open[i + w] && !label[i + w]) { label[i + w] = value; stack[sp++] = i + w; }
    }
    return count;
  };

  const border = [];
  for (let x = 0; x < w; x++) border.push(x, n - w + x);
  for (let y = 0; y < h; y++) border.push(y * w, y * w + w - 1);
  fill(border, border.length, 1);

  const areas = [0, 0];
  for (let i = 0; i < n; i++) {
    if (!open[i] || label[i]) continue;
    areas.push(fill([i], 1, areas.length));
  }
  const minArea = Math.max(...areas) * MIN_LENS_RATIO;

  for (let i = 0; i < n; i++) {
    const v = label[i] >= 2 && areas[label[i]] >= minArea ? 255 : 0;
    alpha[i * 4] = alpha[i * 4 + 1] = alpha[i * 4 + 2] = v;
    alpha[i * 4 + 3] = 255;
  }
  ctx.putImageData(px, 0, 0);

  // blur so the mask (after the shader's smoothstep) tucks slightly under the frame
  const g = createGraphics(w, h);
  g.pixelDensity(1);
  g.drawingContext.filter = 'blur(8px)';
  g.drawingContext.drawImage(c, 0, 0);
  g.drawingContext.filter = 'none';
  return g;
}

function showFrame(i) {
  frameIndex = (i + frames.length) % frames.length;
  overlayEl.src = frames[frameIndex].url;
  clarityGfx.background(0); // fresh glasses, fresh smudges
}

// the overlay rect in screen uv, matching the <img>'s object-fit: contain
function fitRect(fr) {
  const s = min(width / fr.w, height / fr.h);
  const dw = fr.w * s, dh = fr.h * s;
  return [(width - dw) / 2 / width, (height - dh) / 2 / height, dw / width, dh / height];
}

function mousePressed() {
  pressX = mouseX;
  pressY = mouseY;
}

// a click (no real drag) switches frames; dragging still wipes
function mouseReleased() {
  if (dist(pressX, pressY, mouseX, mouseY) < 6) {
    showFrame(frameIndex + 1);
    if (!hasInteracted) {
      hasInteracted = true;
      hintEl.addClass('hidden');
    }
  }
}

function keyPressed() {
  if (key === ' ') {
    showFrame(frameIndex + 1);
    return false;
  }
}

function draw() {
  background(0);

  if (video.width > 0) {
    blurGfx.image(video, 0, 0, bufW, bufH);
    blurGfx.filter(BLUR, 3);
  }

  // fog slowly regrows over any wiped-clear streaks
  clarityGfx.push();
  clarityGfx.noStroke();
  clarityGfx.fill(0, 3);
  clarityGfx.rect(0, 0, bufW, bufH);
  clarityGfx.pop();

  if (mouseIsPressed && mouseY > 0) {
    if (!hasInteracted) {
      hasInteracted = true;
      hintEl.addClass('hidden');
    }
    const mx = map(mouseX, 0, width, 0, bufW);
    const my = map(mouseY, 0, height, 0, bufH);
    const pmx = map(pmouseX, 0, width, 0, bufW);
    const pmy = map(pmouseY, 0, height, 0, bufH);
    clarityGfx.push();
    clarityGfx.stroke(255, 60);
    clarityGfx.strokeWeight(bufH * 0.16);
    clarityGfx.strokeCap(ROUND);
    clarityGfx.line(pmx, pmy, mx, my);
    clarityGfx.pop();
  }

  shader(glassShader);
  glassShader.setUniform('uSharp', video);
  glassShader.setUniform('uBlur', blurGfx);
  glassShader.setUniform('uClarity', clarityGfx);
  glassShader.setUniform('uNoise', noiseGfx);
  glassShader.setUniform('uTime', millis() / 1000.0);
  glassShader.setUniform('uNoiseOffset', [millis() * 0.00002, millis() * 0.000015]);
  const fr = frames[frameIndex];
  glassShader.setUniform('uLens', fr.lens || noLens);
  glassShader.setUniform('uHasLens', fr.failed ? 0.0 : 1.0); // no mask at all: show camera everywhere
  glassShader.setUniform('uFit', fitRect(fr));

  rect(-width / 2, -height / 2, width, height);
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  bufW = floor(width / SCALE_DOWN);
  bufH = floor(height / SCALE_DOWN);
  blurGfx = createGraphics(bufW, bufH);
  const oldClarity = clarityGfx;
  clarityGfx = createGraphics(bufW, bufH);
  clarityGfx.pixelDensity(1);
  clarityGfx.background(0);
  clarityGfx.image(oldClarity, 0, 0, bufW, bufH);
}
</script>
</body>
</html>
